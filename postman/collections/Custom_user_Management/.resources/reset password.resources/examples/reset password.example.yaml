$kind: http-example
request:
  url: http://127.0.0.1:8000/api/auth/reset-password/
  method: POST
  body:
    type: json
    content: "{\r

      \    \"email\": \"user@example.com\",\r

      \    \"otp\": \"252371\",\r

      \    \"new_password\": \"SB@user09\",\r

      \    \"confirm_password\": \"SB@user09\"\r

      }"
response:
  statusCode: 200
  statusText: OK
  headers:
    date: Sun, 18 Oct 2026 11:53:37 GMT
    server: WSGIServer/0.2 CPython/3.13.12
    content-type: application/json
    vary: Accept, Cookie
    allow: POST, OPTIONS
    x-frame-options: DENY
    content-length: "41"
    x-content-type-options: nosniff
    referrer-policy: same-origin
    cross-origin-opener-policy: same-origin
  body:
    type: json
    content: |-
      {
        "detail": "Password reset successfully."
      }
order: 1000
